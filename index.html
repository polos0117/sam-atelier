<!-- 천하 지도(2026-11-17, 사용자 「약간 코에이 삼국지의 지도 같은 느낌이 나겠네」 — 설계 docs/superpowers/specs/2026-11-17-tianxia-map-design.md).
     공방의 첫 화면: 바탕 지도 위에 성 표지와 세력의 땅, 아래에 판도 다섯(군웅록 · 194 · 200 · 208 · 263)과 세계 셋(무협 · 판타지 · 메카). 세력을 누르면 그 진영 막사로 들어간다(같은 화면의 둘째 층, 주소 &f=).
     옛 타이틀의 큰 메뉴와 군막(hall.html)의 최근 그림 · 패치 기록 · 공간 고르기는 ⚙ 도구 상자로 옮겼다. 화면은 lib/tianxia.js, 셈은 lib/tianxia-core.js, 자료는 data/tianxia.json.
     이 공방의 길은 「천하 지도 → 진영 막사 → 장수」 다 — 다른 공방의 뼈대(머리 + 탭 줄 + 목록)를 복사해 오지 않는다. 꽃 장식 틀(lib/material.css)도 여기엔 싣지 않는다.
     예전 게임 주소의 몫(?daily · ?local · #sam-transfer)은 여기서 draft.html 로 그대로 넘긴다 — 공방 지도 · 옛 북마크 · 옛 /atelier/sam.html 길이 안 끊긴다. -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search), h = location.hash || '';
    if (q.has('daily') || q.has('local') || /sam-transfer=/.test(h)) location.replace('draft.html' + location.search + h);
  } catch (e) { /* 아주 옛 브라우저 — 지도 그대로 */ }
})();
</script>
