<title>삼국지 드래프트 — 竹簡</title>
<script>
(function(){
 if(location.protocol!=="file:"||location.hash.indexOf("#sam-transfer=")!==0)return;
 try{
  var data=JSON.parse(decodeURIComponent(location.hash.slice(14)));
  ["samgukji_draft_rec_v1","samgukji_draft_cfg_v1","samgukji_draft_game_v2","samgukji_mark_v1"].forEach(function(k){
   if(typeof data[k]==="string"&&!localStorage.getItem(k)){JSON.parse(data[k]);localStorage.setItem(k,data[k])}
  });
  history.replaceState(null,"",location.pathname+location.search);
 }catch(e){/* The legacy page keeps its original storage if transfer is unavailable. */}
})();
</script>
<!-- 홈 화면에 두면 브라우저가 기록을 걷어가지 못한다 — 모바일에서 전적이 사라지던 까닭 -->
<link rel="manifest" href="sam.webmanifest">
<meta name="theme-color" content="#17130F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="竹簡">
<link rel="apple-touch-icon" href="icons/icon-sam-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.pg.kin .nm2,.pg.kin .vv{color:#6FA08A}
.pg.kin .bar i{background:#6FA08A}
:root{
  --ink:#17130F; --ink2:#221B15; --ink3:#2E251C;
  --paper:#E7DCC3; --paper2:#D4C4A2; --paper3:#B8A47E;
  --gold:#C9A227; --seal:#A81F1A;
  --f-wei:#3E5C8C; --f-shu:#4F7A4A; --f-wu:#C0472F; --f-etc:#7A6A55;
  --line:rgba(201,162,39,.22);
  --display:"Gowun Batang",'Apple SD Gothic Neo',"Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR",'Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 7px),
    radial-gradient(120% 80% at 50% -10%,#2A211A 0%,#17130F 62%);
  color:var(--paper);
  font-family:var(--body);
  min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}

/* ── 머리 ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.title{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1;color:var(--paper)}
.title small{display:block;font-size:10px;letter-spacing:.42em;color:var(--gold);font-family:var(--body);font-weight:500;margin-bottom:7px}
.tally{display:flex;gap:5px;align-items:flex-end;height:26px}
.tally i{width:3px;height:12px;background:var(--paper3);opacity:.3;display:block;border-radius:1px;transition:.35s}
.tally i.done{opacity:1;background:var(--gold);height:18px}
.tally i.now{opacity:1;background:var(--seal);height:26px;box-shadow:0 0 10px rgba(168,31,26,.6)}

.totop{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));z-index:32;
  right:max(16px,calc(50vw - 264px));
  width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--gold);background:#100C09;color:var(--gold);
  font-family:var(--display);font-size:20px;font-weight:700;line-height:1;cursor:pointer;
  box-shadow:0 0 0 3px rgba(16,12,9,.7),0 8px 22px rgba(0,0,0,.65);
  opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .25s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
#totop{bottom:calc(76px + env(safe-area-inset-bottom))}
.totop:active{background:var(--gold);color:#100C09}
.helpbtn{flex:none;width:27px;height:27px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--gold);font-family:var(--display);font-size:15px;line-height:1;cursor:pointer;transition:.2s}
.helpbtn:active{background:rgba(201,162,39,.15)}

/* ── 새 대국 설정 ── */
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dotted rgba(184,164,126,.16)}
.srow .sl{font-family:var(--display);font-size:14px;color:var(--paper2)}
.srow .sl small{display:block;font-size:10px;color:var(--paper3);font-family:var(--body);margin-top:2px;letter-spacing:.02em}
.srow .opt{flex:0 0 46%;padding:9px 6px}
.intro{font-family:var(--display);font-size:13px;line-height:1.8;color:var(--paper2);
  border:1px solid var(--line);border-radius:4px;padding:11px 13px;margin-bottom:16px;background:rgba(201,162,39,.04)}
.intro b{color:var(--gold);font-weight:700}

/* ── 전적 · 도장 ── */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.rcell{border:1px solid var(--line);border-radius:4px;padding:10px 6px;text-align:center;background:rgba(0,0,0,.22)}
.rcell b{display:block;font-family:var(--display);font-size:22px;font-weight:700;color:var(--paper);font-variant-numeric:tabular-nums}
.rcell span{display:block;font-size:9px;letter-spacing:.18em;color:var(--paper3);margin-top:3px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stamp{border:1px solid rgba(184,164,126,.2);border-radius:3px;padding:9px 5px;text-align:center;min-height:52px}
.stamp .sn{font-family:var(--display);font-size:12px;font-weight:700;color:var(--paper2);line-height:1.35}
.stamp .sc{font-size:9px;color:var(--paper3);margin-top:3px;font-variant-numeric:tabular-nums}
.stamp.got{border-color:var(--seal);background:rgba(168,31,26,.07)}
.stamp.got .sn{color:var(--paper)}
.stamp.got.kin{border-color:#6FA08A;background:rgba(111,160,138,.07)}
.stamp.no .sn{color:rgba(184,164,126,.34)}
.stamp.no .sc{color:rgba(184,164,126,.26)}

/* ── 인물 도감 ── */
.dexbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;position:sticky;top:0;background:rgba(10,8,6,.96);padding:8px 0;z-index:2}
.dtab{flex:1 1 18%;padding:8px 4px;font-family:var(--display);font-size:13px;border-radius:3px;cursor:pointer;
  background:transparent;border:1px solid rgba(184,164,126,.22);color:var(--paper3);transition:.18s}
.dtab.on{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.08)}
.dx{padding:10px 0;border-bottom:1px dotted rgba(184,164,126,.16)}
.dx.hide{display:none}
.dx .h1{display:flex;align-items:baseline;gap:8px}
.dx .tr{display:inline-block;font-size:10px;font-weight:700;width:16px;height:16px;line-height:16px;text-align:center;border-radius:2px;color:#F2EADA;margin-right:2px}
.dx .demb{width:14px;height:14px;color:var(--dc);opacity:.8;flex:none;align-self:center}
.dx .nm3{font-family:var(--display);font-size:17px;font-weight:700;color:var(--dc)}
.dx .tg{font-size:10px;letter-spacing:.1em;color:var(--paper3)}
.dx .pv{margin-left:auto;font-family:var(--display);font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.dx .sv{display:flex;gap:10px;margin-top:4px;font-size:10.5px;color:var(--paper3);font-variant-numeric:tabular-nums}
.dx .sv b{color:var(--paper2);font-weight:600}
.dx .lr{font-size:11.5px;color:var(--paper3);margin-top:4px;font-family:var(--display);line-height:1.5}
.dst{font-size:10px;color:var(--paper3);margin-top:4px;font-variant-numeric:tabular-nums}
.dst .up{color:#D9B84A;font-weight:600}.dst .dn{color:#C4685C;font-weight:600}
.dx .cj{font-size:10px;color:#9C8A66;margin-top:4px;line-height:1.5}
.dx .cj em{font-style:normal;color:#6FA08A}
.dexcount{font-size:11px;color:var(--paper3);margin-bottom:10px;letter-spacing:.06em}
.dx .avs{cursor:zoom-in}
/* ── 초상 확대 ── */
.zoom{position:fixed;inset:0;background:rgba(6,5,4,.96);z-index:60;display:none;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.zoom.on{display:flex;animation:fade .22s ease}
.zbox{max-width:420px;width:100%;text-align:center}
.zbox img{width:100%;max-width:360px;aspect-ratio:1;object-fit:cover;border-radius:4px;
  border:1px solid rgba(184,164,126,.3);box-shadow:0 12px 40px rgba(0,0,0,.6);background:#15110C}
.zbox img.soft{filter:blur(.2px) saturate(1.02)}
.zbox .zn{font-family:var(--display);font-size:22px;font-weight:700;color:var(--zc,var(--gold));margin-top:14px}
.zbox .zt{font-size:11px;letter-spacing:.12em;color:var(--paper3);margin-top:3px}
.zbox .zl{font-size:12.5px;color:var(--paper2);margin-top:10px;font-family:var(--display);line-height:1.6}
.zbox .zh{font-size:10px;color:var(--paper3);margin-top:16px;letter-spacing:.08em;opacity:.7}

/* ── 병법 요람 ── */
.hsec{margin-bottom:10px}
.hsec h4{cursor:pointer;user-select:none}
.hsec h4::after{content:"▾";float:right;opacity:.5;transition:.2s}
.hsec.fold h4::after{transform:rotate(-90deg)}
.hsec.fold>*:not(h4){display:none}
.hsec h4{font-family:var(--display);font-size:12px;letter-spacing:.24em;color:var(--gold);margin:0 0 9px;font-weight:400;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.hsec p{margin:0 0 8px;font-size:13px;line-height:1.75;color:var(--paper2)}
.hsec p:last-child{margin-bottom:0}
.hsec b{color:var(--paper);font-weight:600}
.hsec .g{color:var(--gold)}.hsec .r{color:#C4685C}
.form{font-family:var(--display);font-size:12.5px;line-height:1.9;color:var(--paper2);
  background:rgba(0,0,0,.28);border-left:2px solid var(--line);padding:9px 12px;margin:8px 0}
.fold{width:100%;margin-top:4px;padding:9px;background:transparent;border:1px dashed rgba(201,162,39,.35);
  color:var(--gold);font-family:var(--display);font-size:12.5px;letter-spacing:.14em;border-radius:3px;cursor:pointer}
.cb{display:none;margin-top:10px}
.cb.open{display:block}
.cbi{padding:7px 0;border-bottom:1px dotted rgba(184,164,126,.16)}
.cbi .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cbi .t b{font-family:var(--display);font-size:14.5px;font-weight:700}
.cbi .t em{font-style:normal;font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.cbi .m{font-size:11px;color:var(--paper3);margin-top:2px;line-height:1.5}

/* ── 점수판 ── */
.board{display:grid;grid-template-columns:1fr auto 1fr;}
.board.p3{grid-template-columns:1fr auto 1fr 1fr}
.board{align-items:center;gap:6px;margin-top:14px;
  padding:9px 6px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.24)}
.board>div{text-align:center}
.board b{display:block;font-family:var(--display);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;
  transition:color .3s}
.board span{display:block;font-size:9px;letter-spacing:.24em;color:var(--paper3);margin-top:1px}
.board .gap{font-family:var(--display);font-size:13px;font-variant-numeric:tabular-nums;padding:0 4px;letter-spacing:.02em}
.board .gap.lead{color:var(--gold)}.board .gap.trail{color:#C4685C}.board .gap.even{color:var(--paper3)}

/* ── 설정 ── */
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.opt{flex:1 1 30%}
.opt{flex:1;padding:7px;font-family:var(--body);font-size:11.5px;letter-spacing:.06em;border-radius:3px;cursor:pointer;
  background:transparent;border:1px solid rgba(184,164,126,.24);color:var(--paper3);transition:.18s}
.opt::before{content:"○ "}
.opt.on{border-color:rgba(201,162,39,.5);color:var(--gold);background:rgba(201,162,39,.07)}
.opt.on::before{content:"● "}
.opt.cyc{border-color:rgba(201,162,39,.42);color:var(--gold)}
.opt.cyc::before{content:"◈ "}

/* ── 지시문 ── */
.decree{margin:20px 0 14px;text-align:center}
.decree .rd{font-family:var(--display);font-size:13px;color:var(--gold);letter-spacing:.3em}
.decree .msg{font-family:var(--display);font-size:19px;margin-top:6px;color:var(--paper)}
.lorel{font-family:var(--display);font-size:12px;color:var(--paper3);margin-top:5px;min-height:17px;letter-spacing:.02em}

/* ── 카드 ── */
.pack{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{
  position:relative;background:linear-gradient(168deg,var(--paper) 0%,var(--paper2) 100%);
  color:#221B15;border:none;border-radius:3px;padding:11px 11px 9px;text-align:left;
  cursor:pointer;font-family:var(--body);
  box-shadow:0 2px 0 var(--paper3),0 8px 18px rgba(0,0,0,.45);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,opacity .35s;
  overflow:hidden;
}
.card .emb{position:absolute;right:4px;top:24px;width:62px;height:62px;color:var(--fc);opacity:.2;pointer-events:none}
.card::before{content:"";position:absolute;inset:0 0 0 0;width:4px;background:var(--fcg,var(--fc))}
.card:active{transform:translateY(2px) scale(.99)}
.card{animation:deal .34s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes deal{from{opacity:0;transform:translateY(12px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.reroll{width:100%;margin-top:10px;padding:10px;background:transparent;border:1px dashed rgba(201,162,39,.4);
  color:var(--gold);font-family:var(--display);font-size:13px;letter-spacing:.16em;border-radius:3px;cursor:pointer;transition:.2s}
.reroll:active{background:rgba(201,162,39,.12)}
.reroll[disabled]{opacity:.28;cursor:default;border-style:solid;border-color:rgba(184,164,126,.2);color:var(--paper3)}
.card .fac{position:absolute;top:8px;right:9px;font-family:var(--display);font-size:26px;font-weight:700;color:var(--fc);opacity:.16;line-height:1}
.card .nm{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;padding-left:64px;min-height:24px;white-space:nowrap;overflow:hidden}
.card .nm.ln{font-size:17.5px;letter-spacing:0}
@media (max-width:390px){.card .nm{font-size:19px}.card .nm.ln{font-size:16px}}
.card .nm .tr{display:inline-block;font-size:11px;font-weight:700;width:16px;height:16px;line-height:16px;text-align:center;
  border-radius:2px;margin-right:5px;vertical-align:2px;color:#F2EADA}
.tr.t0{background:#A8842A}.tr.t1{background:#5A7A8C}.tr.t2{background:#7A6A55}.tr.t3{background:#9A8E7A}
.card .rl{font-size:10.5px;letter-spacing:.16em;color:#6B5B45;padding-left:52px;margin-top:1px;min-height:14px}
.card .rl b{color:var(--fc);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px;padding-left:6px}
.st{text-align:center}
.st u{display:block;height:3px;border-radius:2px;background:rgba(34,27,21,.14);text-decoration:none;overflow:hidden}
.st u i{display:block;height:100%;background:var(--fc);opacity:.85}
.st b{display:block;font-size:11px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.st span{display:block;font-size:8.5px;color:#7A6A52;letter-spacing:.08em}
.hint{margin-top:6px;padding:0 46px 0 6px;font-size:10px;line-height:1.45;font-weight:600;height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#8A7A62;word-break:keep-all;overflow-wrap:break-word}
.hint .near{margin-left:5px}
.hint.up{color:#8A6E12}.hint.dn{color:#A8402F}
.card.illegal{opacity:.34;filter:grayscale(.7)}
.card.illegal::after{content:"編";position:absolute;top:9px;left:12px;font-family:var(--display);font-size:12px;color:#A8402F;font-weight:700}
.pw{position:absolute;bottom:9px;right:10px;font-family:var(--display);font-size:15px;font-weight:700;color:#3C3227}
.pw em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:#8A7A62;margin-right:3px}

/* 인물 낙관 아바타 */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;
  color:var(--ac);border:1.5px solid var(--ac);background:rgba(255,252,244,.35);overflow:hidden}
.av i{font-style:normal;font-family:var(--display);font-weight:700;line-height:1}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av-lord{border-radius:9px;box-shadow:inset 0 0 0 2px rgba(255,252,244,.5),inset 0 0 0 3px var(--ac)}
.av-war{border-radius:9px}
.av-str{border-radius:9px}
.av-civ{border-radius:9px}
.avc{position:absolute;left:10px;top:9px;width:46px;height:46px;font-size:23px}
.avc.av2 i{font-size:11.5px;writing-mode:vertical-rl;letter-spacing:.05em}
.av2 i{letter-spacing:0}
.avs{width:36px;height:36px;font-size:17px;background:rgba(0,0,0,.25)}
.avs.av2 i{font-size:9px;writing-mode:vertical-rl}

/* 낙관 */
.seal{
  position:absolute;top:50%;left:50%;width:76px;height:76px;margin:-38px 0 0 -38px;
  border:4px solid var(--seal);border-radius:5px;color:var(--seal);
  font-family:var(--display);font-weight:700;font-size:40px;line-height:68px;text-align:center;
  opacity:0;transform:scale(2.4) rotate(-24deg);pointer-events:none;z-index:3;
}
.card.taken .seal{animation:stamp .42s cubic-bezier(.2,1.4,.4,1) forwards}
.card.taken{box-shadow:0 0 0 2px var(--gold),0 8px 24px rgba(0,0,0,.5)}
.card.by-foe{box-shadow:0 0 0 2px #4A6A99,0 8px 24px rgba(0,0,0,.5);filter:saturate(.55) brightness(.9)}
.card.fogged .nm,.card.fogged .rl,.card.fogged .stats,.card.fogged .pw,.card.fogged .fac,.card.fogged .hint,.card.fogged .emb{filter:blur(5px);opacity:.5}
.card.by-foe .seal{border-color:#4A6A99;color:#4A6A99}
.card.by-foe2{box-shadow:0 0 0 2px #7A5A34,0 8px 24px rgba(0,0,0,.5);filter:saturate(.55) brightness(.9)}
.card.by-foe2 .seal{border-color:#7A5A34;color:#7A5A34}
.card[disabled]{cursor:default}
.card.gone{opacity:.12;transform:scale(.96)}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-24deg)}60%{opacity:.95;transform:scale(.92) rotate(-8deg)}100%{opacity:.88;transform:scale(1) rotate(-8deg)}}

/* ── 진영 목록 ── */
.rosters{margin-top:22px;display:grid;gap:12px}
.ros{border:1px solid var(--line);border-radius:4px;padding:11px 12px;background:rgba(0,0,0,.22)}
.ros h3{margin:0 0 9px;font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:.2em;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.ros h3 em{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--paper3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.chip{font-size:12px;padding:3px 8px;border-radius:2px;background:var(--cc);color:#F2EADA;font-weight:500;animation:pop .3s ease}
.slot{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;margin-bottom:6px}
.slot:last-child{margin-bottom:0}
.slot .lb{font-family:var(--display);font-size:13px;color:var(--gold);opacity:.75;line-height:22px;text-align:center}
.slot .cells{display:flex;flex-wrap:wrap;gap:5px}
.chip.fog{background:rgba(60,50,40,.85);color:rgba(231,220,195,.5);letter-spacing:.08em;font-family:var(--display)}
.chip.ph{background:transparent;border:1px dashed rgba(184,164,126,.28);color:rgba(184,164,126,.4)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── 결의 패널 ── */
.pg{padding:7px 0;border-bottom:1px dotted rgba(184,164,126,.14)}
.pg:last-child{border-bottom:none;padding-bottom:0}

.pg .nm2{font-family:var(--display);font-size:14.5px;font-weight:700;color:var(--paper)}

.pg .bar i{display:block;height:100%;background:var(--gold);opacity:.55}
.pg.done .bar i{opacity:1}
.pgempty{font-size:12px;color:var(--paper3);font-family:var(--display)}
.near{display:block;margin-top:3px;font-size:9.5px;color:#7C6A4E;font-weight:500;line-height:1.35}

/* ── 결의 완성 연출 ── */
#toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:30;pointer-events:none;
  display:flex;flex-direction:column;gap:8px;align-items:center;width:min(86vw,420px)}
.tst{font-family:var(--display);text-align:center;background:rgba(16,12,9,.94);
  border:1px solid var(--gold);border-radius:4px;padding:12px 22px 13px;
  box-shadow:0 0 0 3px rgba(16,12,9,.94),0 0 34px rgba(201,162,39,.35),0 14px 40px rgba(0,0,0,.6);
  animation:tstIn .5s cubic-bezier(.2,1.3,.4,1) both,tstOut .45s ease-in forwards;animation-delay:0s,var(--hold,1.7s)}
.tst .tt{font-size:11px;letter-spacing:.4em;color:var(--gold);opacity:.85}
.tst .tn{font-size:22px;font-weight:700;color:var(--paper);margin-top:3px;letter-spacing:.08em}
.tst .tv{font-size:13px;color:var(--gold);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.1em}
.tst.kin{border-color:#6FA08A;box-shadow:0 0 0 3px rgba(16,12,9,.94),0 0 34px rgba(111,160,138,.35),0 14px 40px rgba(0,0,0,.6)}
.tst.kin .tt,.tst.kin .tv{color:#6FA08A}
.tst.bad{border-color:#A8402F;box-shadow:0 0 0 3px rgba(16,12,9,.94),0 0 30px rgba(168,64,47,.4),0 14px 40px rgba(0,0,0,.6)}
.tst.bad .tt,.tst.bad .tv{color:#C4685C}
@keyframes tstIn{0%{opacity:0;transform:scale(1.7) rotate(-5deg)}62%{opacity:1;transform:scale(.96) rotate(1deg)}100%{opacity:1;transform:scale(1)}}
@keyframes tstOut{to{opacity:0;transform:translateY(-14px) scale(.96)}}

/* ── 결과 ── */
.veil{position:fixed;inset:0;background:rgba(10,8,6,.93);backdrop-filter:blur(3px);z-index:20;overflow-y:auto;display:none}
.veil.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.res{max-width:560px;margin:0 auto;padding:34px 16px 48px}
.verdict{text-align:center;font-family:var(--display);margin-bottom:26px}
.orn{display:block;width:160px;height:14px;margin:12px auto 0;color:var(--gold);opacity:.65}
.slot .lb svg{width:13px;height:13px;display:block;margin:0 auto 1px;opacity:.7}
.verdict .big{font-size:46px;font-weight:700;letter-spacing:.18em;line-height:1.1}
.verdict .sub{font-size:13px;color:var(--paper3);margin-top:8px;letter-spacing:.06em;font-family:var(--body)}
.win{color:var(--gold);text-shadow:0 0 26px rgba(201,162,39,.35)}
.lose{color:#8C7F6C}
.draw{color:var(--paper2)}
.tote{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:22px}
.tote div{text-align:center}
.tote .num{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tote .lbl{font-size:10px;letter-spacing:.2em;color:var(--paper3);margin-top:2px}
.tote .vs{font-family:var(--display);color:var(--seal);font-size:15px;letter-spacing:.1em}
.ledger{border-top:1px solid var(--line)}
.ledger h4{font-family:var(--display);font-size:12px;letter-spacing:.24em;color:var(--gold);margin:18px 0 8px;font-weight:400}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted rgba(184,164,126,.16);font-size:13px}
.row span{color:var(--paper2)}
.row b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.up{color:#D9B84A}.dn{color:#C4685C}
.row.tot{border-bottom:none;border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-family:var(--display);font-size:16px}
.lore{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-bottom:1px dotted rgba(184,164,126,.16);font-size:12.5px}
.lore b{font-family:var(--display);font-size:15px;font-weight:700;color:var(--cc)}
.lore span{color:var(--paper3);line-height:1.5;padding-top:2px}

.rnd .rh em{font-style:normal;font-size:10px;color:var(--paper3)}

.rl2 .jd .up{font-weight:600}
.rl2 .jd .dn{font-weight:600}
.rwhy{padding:1px 0 3px 52px;font-size:10px;color:#8A7A62;letter-spacing:.02em}

.hist .r1{font-family:var(--display);font-size:12px;color:var(--gold);opacity:.8}
.hist .r2 b{color:var(--paper)}
.hist .r2 span{color:#8C9BB5}
.hist .r2 em{font-style:normal;font-size:10px;color:var(--paper3);margin-left:5px}
.btn2{display:block;width:100%;margin-top:10px;padding:12px;background:transparent;border:1px dashed rgba(184,164,126,.35);
  color:var(--paper2);font-family:var(--display);font-size:13.5px;letter-spacing:.2em;border-radius:3px;cursor:pointer}
.btn2:active{background:rgba(184,164,126,.12)}
.tale{font-family:var(--display);font-size:14px;line-height:1.85;color:var(--paper2);background:rgba(201,162,39,.05);border-left:2px solid var(--seal);padding:12px 14px;margin:20px 0 4px}
.btn{display:block;width:100%;margin-top:22px;padding:14px;background:transparent;border:1px solid var(--gold);color:var(--gold);
  font-family:var(--display);font-size:15px;letter-spacing:.3em;border-radius:3px;cursor:pointer;transition:.2s}
.btn:active{background:var(--gold);color:var(--ink)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Compatibility for saved progress and the thirteen-pick final lineup. */
#draftSummary,#tArt{display:none}

#detail{z-index:70}.pick-portrait{width:100%;height:220px;object-fit:contain}
.pick-actions{position:sticky;bottom:0;background:var(--ink);padding:8px 0}

.lineup-card{min-height:66px;padding:8px;background:var(--ink2);color:var(--paper);border:1px solid var(--line);border-radius:4px;font:600 14px var(--body);text-align:left}
.lineup-card small{display:block;font-size:11px;margin:3px 0}.lineup-card b{font-size:11px}

var QUOTA="재는 중", PERSIST="모름";

  try{
    if(navigator.storage&&navigator.storage.estimate)
      navigator.storage.estimate().then(function(e){
        var mb=function(n){return (n/1048576).toFixed(1)+"MB"};
        QUOTA=mb(e.usage||0)+" / "+mb(e.quota||0);
        var d=$("diagBox"); if(d)d.innerHTML=diagInner();
      });
    else QUOTA="이 브라우저는 알려주지 않소";
    if(navigator.storage&&navigator.storage.persisted)
      navigator.storage.persisted().then(function(ok){
        PERSIST=ok?"붙박이 — 브라우저가 함부로 못 걷어가오":"임시 — 자리가 모자라거나 오래 안 오면 걷어가오";
        var d=$("diagBox"); if(d)d.innerHTML=diagInner();
      });
    else PERSIST="이 브라우저는 알려주지 않소";
  }catch(e){}
}
function askPersist(){
  if(!(navigator.storage&&navigator.storage.persist)){alert("이 브라우저는 붙박이를 받지 않소");return}
  navigator.storage.persist().then(function(ok){
    PERSIST=ok?"붙박이 — 브라우저가 함부로 못 걷어가오"
      :'<b style="color:var(--gold)">청하였으나 거절당했소</b> — 크롬은 <u>북마크에 넣거나 홈 화면에 추가한</u> '

function evaluate(team,partial){

function evaluateRaw(team,partial){
  var out={rows:[],total:0},base=0,i,j;
  for(i=0;i<team.length;i++)base+=power(team[i]);
  out.rows.push({k:"인물 전력 합",v:base});
  // 진영 시너지
  var cnt={};
  for(i=0;i<team.length;i++){var tfs=facsOf(team[i]),ti;for(ti=0;ti<tfs.length;ti++)cnt[tfs[ti]]=(cnt[tfs[ti]]||0)+1}
  for(var f in cnt){
    var n=cnt[f],p=SYN[n]||0,ex=0;
    if(PACK2)p=Math.round(p*(PACK2.synMul||1));
    if(f==="군웅"){
      var mul=ETC_BASE,kk;
      for(kk in ETC)if(n>=+kk)mul=ETC[kk];
      ex=Math.round(p*mul)-Math.round(p*ETC_BASE);
      p=Math.round(p*ETC_BASE);
    }
    if(p)out.rows.push({k:"진영 결속 · "+f+" "+n+"인",v:p});
    if(ex)out.rows.push({k:"군웅할거 · "+n+"인 규합",v:ex});
    base+=p+ex;
  }
  // 결의
  for(i=0;i<COMBO.length;i++){
    var cb=COMBO[i],hit=0;
    for(j=0;j<team.length;j++)if(cb.m.indexOf(team[j][0])>=0)hit++;
    var best=0,bk=0;
    for(var k in cb.t){if(hit>=+k&&+k>=bk){bk=+k;best=cb.t[k]}}
    if(best){out.rows.push({k:(cb.k?"혈연 · ":"")+cb.n,v:best});base+=best}
  }
  // 군주
  var lords=0,warr=0,brain=0,lord=null;
  for(i=0;i<team.length;i++){
    // 주공이 여럿이면 그릇이 큰 이를 앞에 세운다
    if(roleOf(team[i])==="군주"){lords++;if(!lord||lordRate(team[i])>lordRate(lord))lord=team[i]}
    if(roleOf(team[i])==="무장")warr++;
    if(roleOf(team[i])==="책사"||roleOf(team[i])==="문관")brain++;
  }
  if(lords>=1){
    var rate=lordRate(lord),same=0;
    for(i=0;i<team.length;i++){var lf=facsOf(lord),mf=facsOf(team[i]),hit=false,a,b;
      for(a=0;a<mf.length&&!hit;a++)for(b=0;b<lf.length;b++)if(mf[a]===lf[b]){hit=true;break}
      if(hit)same++;}
    var eff=Math.round(rate*(.5+.5*same/team.length)*10)/10,
        b=Math.round(base*eff/100);
    out.rows.push({k:"주공 "+lord[0]+"의 그릇 +"+eff+"%"+(same<team.length?" (동향 "+same+"인)":""),v:b});base+=b;
    if(lords>1&&!ruleOn){var d=-Math.round(base*.08);out.rows.push({k:"주공 "+lords+"인 내분 -8%",v:d});base+=d}
  }
  // 편성 규칙을 켜면 자리가 강제되니, 채우지 못한 것은 실책이 아니라 운이라 보고 감점하지 않는다
  else if(!partial&&!ruleOn){out.rows.push({k:"주공 부재",v:-40});base-=40}
  if(!partial&&!ruleOn&&warr<2){out.rows.push({k:"무장 부족",v:-50});base-=50}
  if(!partial&&!ruleOn&&brain<1){out.rows.push({k:"막료 부재",v:-50});base-=50}
  out.total=Math.round(base);
  return out;
}

}
function weightedCard(indices){

 var sum=weights.reduce(function(a,b){return a+b},0),v=Math.random()*sum;

function drawCards(n,t,exclude){

   var bag=[],best=99;
   for(var i=0;i<pool.length;i++){
     var c=pool[i];if(exclude.indexOf(c[0])>=0||(exhaustOn&&shown[c[0]]))continue;
     var d=t===null?0:Math.abs(tierOf(c)-t);
     if(d<best){best=d;bag=[]}if(d===best)bag.push(i);

   for(var i=0;i<pool.length;i++){

     var d=t===null?0:Math.abs(tierOf(c)-t);if(d<best){best=d;bag=[]}if(d===best)bag.push(i);
   }

/* ───────── 기질 탐구 ───────── */
var LAB_N=30;                    // 기질당 대국 수
function labPick(team,foeTeam,cands,st){
  var tb=evaluate(team,true).total,fb2=evaluate(foeTeam,true).total,best=cands[0],bs=-1e9,i;
  for(i=0;i<cands.length;i++){
    var cc=cands[i];
    var gain=evaluate(team.concat([cc]),true).total-tb;
    var deny=evaluate(foeTeam.concat([cc]),true).total-fb2;
    var realST=AI_ST;AI_ST=st;var stSc=styleScore(cc,team);AI_ST=realST;
    var sc=gain+.45*deny+stSc+Math.random()*20;
    if(sc>bs){bs=sc;best=cc}
  }
  return best;
}
function labLegal(team,cs){
  var n={"군주":0,"무장":0,"참모":0},i,ok=[];
  for(i=0;i<team.length;i++)n[catOf(team[i])]++;
  for(i=0;i<cs.length;i++)if(n[catOf(cs[i])]<CAPS[catOf(cs[i])])ok.push(cs[i]);
  return ok.length?ok:cs;
}
function labRun(st){
  var pickN={},comboN={},i,r,j;
  var sumPw=0,sumMu=0,sumJi=0,sumCnt=0,sumCombo=0,sumTot=0,facN={};
  for(var g=0;g<LAB_N;g++){
    var pool=C.slice(),A=[],B=[];
    for(r=0;r<ROUNDS;r++){
      var pk=[];
      for(i=0;i<PACK&&pool.length;i++)pk.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
      var rem=pk.slice();
      var order=(r%2)?[[B,A,null],[A,B,st]]:[[A,B,st],[B,A,null]];
      for(j=0;j<order.length;j++){
        var me=order[j][0],op=order[j][1],sty=order[j][2];
        var c=labPick(me,op,labLegal(me,rem),sty===null?0:sty);
        me.push(c);rem=rem.filter(function(x){return x!==c});
      }
      pool=pool.concat(rem);
    }
    for(i=0;i<A.length;i++){
      pickN[A[i][0]]=(pickN[A[i][0]]||0)+1;
      sumPw+=power(A[i]);sumMu+=A[i][4];sumJi+=A[i][5];sumCnt++;
      facN[A[i][1]]=(facN[A[i][1]]||0)+1;
    }
    var fired=pledges(A).filter(function(x){return x.got>0});
    sumCombo+=fired.length;sumTot+=evaluate(A).total;
    for(i=0;i<fired.length;i++)comboN[fired[i].n]=(comboN[fired[i].n]||0)+1;
  }
  var fk=[],k;for(k in facN)fk.push(k);
  fk.sort(function(a,b){return facN[b]-facN[a]});
  return {pick:pickN,combo:comboN,
    pw:(sumPw/sumCnt).toFixed(1),mu:(sumMu/sumCnt).toFixed(1),ji:(sumJi/sumCnt).toFixed(1),
    cb:(sumCombo/LAB_N).toFixed(1),tot:Math.round(sumTot/LAB_N),
    fac:fk.slice(0,2).map(function(x){return x+" "+Math.round(facN[x]/sumCnt*100)+"%"}).join(" · ")};
}

  h+='<button class="btn" id="labGo">셈 하 여 보 다</button>';
  h+='<div id="labOut"></div>';
  h+='<button class="btn2" id="labClose" style="margin-top:10px">닫 다</button>';

    var btn=this;btn.disabled=true;btn.textContent="헤아리는 중…";

    var st=0;
    function step(){
      var res=labRun(st);
      var pk=[],cb=[],k;
      for(k in res.pick)pk.push([k,res.pick[k]]);
      for(k in res.combo)cb.push([k,res.combo[k]]);
      pk.sort(function(a,b){return b[1]-a[1]});cb.sort(function(a,b){return b[1]-a[1]});

         '<div class="row"><span>죽간 평균 전력</span><b>'+res.pw+'</b></div>'+
         '<div class="row"><span>평균 무력 · 지력</span><b>'+res.mu+' · '+res.ji+'</b></div>'+
         '<div class="row"><span>한 판에 맺은 결의</span><b class="up">'+res.cb+'</b></div>'+
         '<div class="row"><span>즐겨 세운 깃발</span><b>'+res.fac+'</b></div>';
      o+='<div class="row" style="margin-top:6px"><span style="color:var(--paper3)">즐겨 취한 죽간</span></div>';
      for(var i=0;i<8&&i<pk.length;i++)
        o+='<div class="row"><span><b style="color:var(--paper)">'+pk[i][0]+'</b></span><b>'+Math.round(pk[i][1]/LAB_N*100)+'%</b></div>';
      o+='<div class="row" style="margin-top:6px"><span style="color:var(--paper3)">자주 맺은 결의</span></div>';
      for(var j2=0;j2<7&&j2<cb.length;j2++)
        o+='<div class="row"><span><b style="color:var(--paper)">'+cb[j2][0]+'</b></span><b class="up">'+Math.round(cb[j2][1]/LAB_N*100)+'%</b></div>';
      o+='</div>';
      out.innerHTML+=o;
      st++;
      if(st<5){btn.textContent="헤아리는 중… ("+st+"/5)";setTimeout(step,30)}
      else{btn.textContent="다 시 셈 하 다";btn.disabled=false}
    }
    setTimeout(step,30);
  });
}

     '<p>확장팩은 넷이오 — <span class="g">군웅할거 一九四</span>, <span class="g">관도대전 二〇〇</span>(관우는 조조의 진중에, 유비는 원소의 객장으로 있소), <span class="g">적벽대전 二〇八</span>(형주의 항장들이 조조군 깃발 아래 서고, 아비 잃은 마초가 서량의 주공으로 셈되오), <span class="g">삼국종결 二六三</span>(사마씨의 진, 강유의 촉, 저무는 오, 회남의 불씨가 겨루오). 소속은 그 해를 따르나 결의와 혈연은 세월을 넘소.</p>'+
     '<p>다섯째 팩 <span class="g">군웅록 · 遍歷</span>은 온 시대의 인물이 다 나오되, 저마다 <b>몸담았던 모든 세력의 빛깔</b>을 지니오. 가후는 동탁·장수·조위 세 결속을 한 몸에 이으니, 섬긴 주인이 많을수록 여러 깃발을 잇는 <b>이음쇠</b>가 되오. 진(晉)을 연 사마씨와 그 신하들은 <b>조위와 진</b> 두 빛깔을 함께 지니되, 스스로 제위에 오른 <b>사마염</b>은 진의 빛만 지니오. 이 편에서는 <b>여포·장수·장각·맹획</b>이 제 무리의 주공으로 셈되오. 다만 결속의 무게는 조금 가볍게 셈하오. 죽간의 <b>빛깔과 낙관은 마지막으로 섬긴 곳</b>을 따르고, 왼편의 색동 띠가 거쳐 온 차례를 보이오 — 관우는 조조의 진중을 거쳤으나 끝내 촉으로 돌아갔으니 촉의 빛이오.</p>'+
     '<p><b>대국 인원</b>을 셋으로 하면 <b>정립전</b>이오. 세 진영이 같은 죽간을 번갈아 취하고(선공은 진마다 도는 차례), 마지막에 세 합계를 견주어 수위를 가리오. 이때 승리는 <b>두 적장을 모두</b> 눌러야 하오. 금지 드래프트는 셋이 하나씩 지우고, 시나리오 대전에서는 쓰이지 않소.</p>'+

     '<p><b>적진 가리기</b>를 켜면 적장의 편성과 점수가 안개에 덮이오. 채간 죽간은 흐려지고 자리(主·武·謀)만 드러나며, 점수판에는 <span class="g">霧</span> 한 글자만 남소. 승부는 마지막에야 밝혀지오. 안개 속에서는 적장의 견제도 절반으로 무디어지오 — 그도 아군의 패를 온전히 보지 못하는 셈이오.</p>'+
     '<p><b>시대</b>를 고르면 죽간더미가 달라지오. <span class="g">군웅할거</span>는 후기 인물이 아직 나서지 않았고, <span class="g">삼국정립</span>은 초기 군웅이 이미 스러진 뒤요. 시대를 바꾸면 판이 새로 시작되오.</p></div>';
  h+='<div class="hsec"><h4>판정</h4>'+
     '<p>'+ROUNDS+'진이 끝나면 추천 편성에서 최종 11명을 확정하고 모든 진영의 합계를 견주어 높은 쪽이 이기오. 결과 화면에 <b>양쪽 채점표가 항목별로</b> 나오니 어디서 갈렸는지 짚어볼 수 있소.</p>'+

var banCand=[],banQ=[];
function banPhase(){
  banQ=foe2?["me","foe","foe2"]:["me","foe","me","foe"];
  banLeft=banQ.length;
  var srt=pool.slice().sort(function(a,b){return power(b)-power(a)});
  banCand=srt.slice(0,12).map(function(c){return {c:c,by:null}});
  chips($("mine"),mine,ROUNDS);chips($("foe"),foe,ROUNDS);
  $("myct").textContent="0 / "+ROUNDS;$("opct").textContent="0 / "+ROUNDS;
  board();tally();
  $("rd").textContent=foe2?"禁 · 셋이 하나씩 지우오":"禁 · 두 사람을 지우시오";
  $("msg").textContent="가장 두려운 죽간부터 거두는 법이오";
  $("sub").textContent="";
  $("reroll").disabled=true;
  busy=true;renderBan();banStep();
}
function renderBan(){
  var box=$("pack");box.innerHTML="";
  banCand.forEach(function(e,i){
    var el=card(e.c,i);
    el.style.animation="none";
    if(e.by){
      el.disabled=true;el.classList.add("taken");
      el.querySelector(".seal").textContent="禁";
      if(e.by==="foe")el.classList.add("by-foe");
      if(e.by==="foe2")el.classList.add("by-foe2");
    }else{
      el.addEventListener("click",function(){myBan(i)});
    }
    box.appendChild(el);
  });
}
function banStep(){
  saveGame("ban",[]);
  if(!banQ.length){later(function(){buildTiers(pool);nextRound()},820);return}
  var t=banQ[0];
  if(t==="me"){busy=false;$("msg").textContent="금할 인물을 고르시오"}
  else later(aiBan,650);
}
function myBan(i){
  if(busy||banCand[i].by||banQ[0]!=="me")return;
  busy=true;banQ.shift();
  banCand[i].by="me";bans.me.push(banCand[i].c[0]);
  removeFromPool(banCand[i].c);
  renderBan();
  $("msg").textContent=banCand[i].c[0]+"을(를) 금하였소";
  banStep();
}
function aiBan(){
  var seat=banQ.shift(),rem=[],i;
  for(i=0;i<banCand.length;i++)if(!banCand[i].by)rem.push(i);
  var best=rem[0],bs=-1e9;
  for(i=0;i<rem.length;i++){
    var sc=power(banCand[rem[i]].c)+Math.random()*NOISE[AI_LV];
    if(sc>bs){bs=sc;best=rem[i]}
  }
  banCand[best].by=(seat==="foe")?"foe":"foe2";
  bans[seat].push(banCand[best].c[0]);
  removeFromPool(banCand[best].c);
  renderBan();
  $("msg").textContent=seatName(seat)+" 적장은 "+banCand[best].c[0]+"을(를) 금하였소";
  banStep();
}
function removeFromPool(c){
  for(var i=0;i<pool.length;i++)if(pool[i][0]===c[0]){pool.splice(i,1);return}
}

function aiPick(seat){
  var team=seatTeam(seat),other=(seat==="foe"&&foe2)?foe2:foe;
  var st=(seat==="foe")?ST_A:ST_B;
  var rem=legalSet(team,openIdx()),i;
  // 換 판단: 남은 죽간의 최선 이득이 그 진의 통상치에 못 미치면 물리고 다시 편다
  if(aiRR[seat]>0&&RR_K[AI_LV]>0&&round<ROUNDS-1){
    var tb0=evaluate(team,true).total,bg0=-1e9;
    for(i=0;i<rem.length;i++){
      var g0=evaluate(team.concat([packArr[rem[i]].c]),true).total-tb0;
      if(g0>bg0)bg0=g0;
    }
    if(bg0<rrBase(round)*RR_K[AI_LV]){
      aiRR[seat]--;hist[round].rr.push(seatName(seat));
      var replaced=replaceOpen();
      ensureChoices(team);
      saveGame("draft",[seat].concat(turnQ));
      renderPack(true);
      $("msg").textContent=seatName(seat)+" 적장 — \""+RR_SAY[Math.floor(Math.random()*RR_SAY.length)]+"\"";
      $("sub").textContent=seatName(seat)+" 적장이 죽간을 물리고 다시 폈소";
      later(function(){aiPick(seat)},780);
      return;
    }
  }
  var best=rem[0],bs=-1e9,bestWhy=null,
      tb=evaluate(team,true).total,
      mb=evaluate(mine,true).total,
      ob=(foe2&&other!==team)?evaluate(other,true).total:null;
  for(i=0;i<rem.length;i++){
    var cc=packArr[rem[i]].c;
    var gain=evaluate(team.concat([cc]),true).total-tb;
    var dMe=evaluate(mine.concat([cc]),true).total-mb;
    var dOt=(ob!==null)?evaluate(other.concat([cc]),true).total-ob:-1e9;
    // 정립전에서는 두 상대를 함께 보되, 앞선 쪽을 더 견제한다
    if(ob!==null){
      var wMe=(mb>=ob)?1.2:.85, wOt=(ob>mb)?1.2:.85;
      dMe*=wMe; dOt*=wOt;
    }
    var deny=Math.max(dMe,dOt);
    var threat=0;
    if(AI_LV===2&&!fogOn){
      var tMe=threatScore(cc,mine), tOt=(ob!==null)?threatScore(cc,other):0;
      threat=Math.max(tMe,tOt)*.3;
    }
    var stSc;
    var realST=AI_ST;AI_ST=st;stSc=styleScore(cc,team);AI_ST=realST;
    var fb=(PACK2&&aiFac[seat]&&facsOf(cc).indexOf(aiFac[seat])>=0)?PACK2.bias:0;
    var sc=gain+DENY[AI_LV]*(fogOn?.5:1)*deny+threat+stSc+fb+Math.random()*NOISE[AI_LV];
    if(sc>bs){bs=sc;best=rem[i];bestWhy={g:Math.round(gain),d:Math.round(DENY[AI_LV]*(fogOn?.5:1)*deny+threat),s:Math.round(stSc)}}
  }
  packArr[best].by=(seat==="foe")?"foe":"foe2";
  team.push(packArr[best].c);
  chips($(seat==="foe"?"foe":"foe2"),team,ROUNDS);
  $(seat==="foe"?"opct":"opct2").textContent=team.length+" / "+ROUNDS;
  var name=packArr[best].c[0];
  hist[round][seat]=name;
  hist[round][seat+"Why"]=bestWhy;
  $("sub").textContent=fogOn?seatName(seat)+" 적장이 죽간 하나를 소매에 감추었소":name+" — "+(LORE[name]||"");
  $("msg").textContent=fogOn?seatName(seat)+" 적장이 하나를 취하였소":seatName(seat)+" 적장은 "+name+"을(를) 취하였소";
  board();renderPack(false);
  advanceTurn(false);
}

function tale(me,op,team){
  var top=team.slice().sort(function(a,b){return power(b)-power(a)})[0];
  var d=me.total-op.total,l;
  if(d>140)l="적진은 첫 합에 무너졌소. "+top[0]+"의 깃발이 강을 건너 북쪽 벌판까지 나아갔다 하오.";
  else if(d>0)l="접전이었소. 해질 무렵 "+top[0]+"이(가) 적의 중군을 갈랐고, 그것으로 승부가 갈렸소.";
  else if(d===0)l="양군은 사흘을 대치하다 각기 물러났소. 승패는 다음 해로 미루어졌소.";
  else if(d>-140)l=top[0]+"이(가) 홀로 분전하였으나, 진의 결속이 적에 미치지 못하였소.";
  else l="진이 서로 어우러지지 못하였소. 장수는 흩어지고 막료는 말이 없었소.";
  return l;
}

function fallback(txt){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    var ok=document.execCommand("copy");document.body.removeChild(ta);return ok;
  }catch(e){return false}
}


function lineupOverflow(team){
 if(!ruleOn)return 0;
 var n=counts(team),over=0;Object.keys(CAPS).forEach(function(k){over+=Math.max(0,n[k]-CAPS[k])});return over;
}
function bestLineup(team,partial){
 if(team.length<=FINAL_SIZE)return {team:team.slice(),over:lineupOverflow(team),score:evaluateRaw(team,partial).total};
 var key=(PACK2?PACK2.n:"")+"|"+ruleOn+"|"+!!partial+"|"+team.map(function(c){return c[0]}).join(",");
 if(lineupCache[key])return lineupCache[key];
 var best=null;
 function visit(pos,picked){
   if(picked.length===FINAL_SIZE){var over=lineupOverflow(picked);if(best&&over>best.over)return;
     var score=evaluateRaw(picked,partial).total;
     if(!best||over<best.over||score>best.score)best={team:picked.slice(),over:over,score:score};return;}
   if(team.length-pos<FINAL_SIZE-picked.length)return;
   for(var i=pos;i<team.length;i++){picked.push(team[i]);visit(i+1,picked);picked.pop()}
 }
 visit(0,[]);if(lineupCacheCount>300){lineupCache={};lineupCacheCount=0}lineupCacheCount++;lineupCache[key]=best;return best;
}

function finish(){
  if(mine.length>FINAL_SIZE){beginLineup();return;}
  var i,me=evaluate(mine),op1=evaluate(foe),op2=foe2?evaluate(foe2):null;
  var op=(op2&&op2.total>op1.total)?op2:op1;  // 최강 적 기준

  if(me.total>op.total)REC.win++;else if(me.total<op.total)REC.lose++;else REC.draw++;

    var tied=(op1.total===me.total||op2.total===me.total);
    word=rank===1?(tied?"共 同 一 位":"天 下 統 一"):rank===2?(tied?"共 同 二 位":"鼎 立 二 位"):"鼎 立 末 位";

  var h='<div class="verdict"><div class="big '+cls+'">'+word+'</div><svg class="orn"><use href="#orn-knot"/></svg><div class="sub">'+
        (d>0?"점수차 "+d+"점":d<0?"점수차 "+(-d)+"점":"동수")+'</div></div>';
  if(op2){
    h+='<div class="tote" style="grid-template-columns:1fr 1fr 1fr"><div><div class="num">'+me.total+'</div><div class="lbl">我 軍</div></div>'+

       '<div class="vs">對</div><div><div class="num">'+op.total+'</div><div class="lbl">敵 軍</div></div></div>';
  }
  var fresh=[];
  for(i=0;i<COMBO.length;i++)if(REC.stamps[COMBO[i].n]===REC.games)fresh.push((COMBO[i].k?"血 ":"")+COMBO[i].n);
  if(fresh.length)h+='<div class="tale" style="border-left-color:var(--gold)">처음 맺은 인연 — '+fresh.join(" · ")+'</div>';
  h+='<div class="tale">'+tale(me,op,mine)+'</div>';

  // 대전 기록
  var ma=mine.slice().sort(function(a,b){return power(b)-power(a)}),
      oa=opTeam.slice().sort(function(a,b){return power(b)-power(a)}),
      wn=0,ls=0,dw=0;
  h+='<div class="ledger sub-ledger"><h4>참고 · 합(合)별 전력 대조'+(op2?' · 對 '+(op===op2?'敵二':'敵一'):'')+'</h4>';
  for(i=0;i<ma.length;i++){
    var pa=power(ma[i]),pb=power(oa[i]),gap=pa-pb,rs,cl;
    if(gap>18){rs="아군 승";cl="w";wn++}
    else if(gap>4){rs="근소 우세";cl="w";wn++}
    else if(gap>-5){rs="무승부";cl="d";dw++}
    else if(gap>-19){rs="근소 열세";cl="l";ls++}
    else{rs="적군 승";cl="l";ls++}
    h+='<div class="duel"><span class="hb">'+NUM[i]+'합</span>'+
       '<span class="pair"><b>'+ma[i][0]+'</b> '+pa+' &nbsp;對&nbsp; '+oa[i][0]+' '+pb+'</span>'+
       '<span class="rs '+cl+'">'+rs+'</span></div>';
  }
  h+='<div class="row tot"><span>합계</span><b>'+wn+'승 '+dw+'무 '+ls+'패</b></div>'+
     '<div class="row" style="opacity:.6;font-size:10px"><span>전력이 높은 순으로 짝지은 참고 비교이며, 최종 승패와는 무관하오</span></div></div>';

  var iWon=me.total>op1.total&&(!op2||me.total>op2.total);

  tally(REC.by.st,AI_ST_NAME[ST_A]);

  // 적장이 실제로 취한 죽간과 맺은 결의를 기질별로 남긴다
  function logAI(team,stName,won){

    }
    var fr=pledges(team).filter(function(x){return x.got>0});
    a.cbN+=fr.length;a.tot+=ev.total;
    for(q=0;q<fr.length;q++)a.cb[fr[q].n]=(a.cb[fr[q].n]||0)+1;
    REC.aist[stName]=a;
  }
  logAI(foe,AI_ST_NAME[ST_A],op1.total>me.total&&(!op2||op1.total>op2.total));
  if(foe2)logAI(foe2,AI_ST_NAME[ST_B],op2&&op2.total>me.total&&op2.total>op1.total);

  recSave(REC);
  if(newFeats.length){
    var fn=[];
    for(i=0;i<newFeats.length;i++)for(var fi=0;fi<FEATS.length;fi++)if(FEATS[fi].id===newFeats[i])fn.push(FEATS[fi].n);
    h+='<div class="tale" style="border-left-color:#6FA08A">과업을 이루었소 — '+fn.join(" · ")+'</div>';
  }

  // 복기 — 진별 통합표 (돌아보기 + 전황 기록)
  var missed=0,rpMap={},rp;
  for(i=0;i<replay.length;i++){missed+=Math.max(0,replay[i].bg-replay[i].pg);rpMap[replay[i].rd]=replay[i]}
  h+='<div class="ledger"><h4>복기 · 즉시 득점 차이 '+missed+'점</h4><p class="pgempty">각 선택 당시의 점수만 비교합니다. 미래 인연과 견제의 가치는 포함하지 않으며, 합계는 최종 손실 점수가 아닙니다.</p>';
  if(bans.me.length||bans.foe.length)
    h+='<div class="hist"><span class="r1">禁</span><span class="r2">我 <b>'+bans.me.join("·")+'</b> / 敵 <span>'+bans.foe.join("·")+(bans.foe2.length?" · "+bans.foe2.join("·"):"")+'</span></span></div>';
  for(i=0;i<hist.length;i++){
    var g=hist[i];if(!g)continue;

       (g.rr&&g.rr.length?'<em>換 '+g.rr.join("·")+'</em>':'')+'</div>';

 }catch(e){cfgApply(before);ROUNDS=beforeRounds;clearGame();return false}

<script>
/* ══ 새 판 살피기 ══
   홈 화면 앱에는 주소창도 새로고침 단추도 없다. 그래서 스스로 살핀다.
   본문을 통째로 다시 받으면 데이터가 아까우니 머리(HEAD)만 물어 견준다.
   판이 한창일 수 있으니 제멋대로 갈아타지 않고, 띠를 띄워 누를 때 갈아탄다 */
(function(){
  /* 견줄 자리를 "이 창이 처음 본 표" 로 잡으면 안 된다.
     화면에 떠 있는 쪽이 캐시에서 온 옛 판이면 첫 살핌이 서버의 새 판을
     "이미 본 것" 으로 적어 버려 영영 알리지 못한다. 안 뜨던 까닭이 이것이다.
     그래서 지금 이 문서가 서버를 떠난 때(document.lastModified)를 기준 삼는다.
     그보다 서버 쪽이 나중이면 새 판이다 — 캐시에서 왔든 아니든 맞게 걸린다.
     표(etag)는 CDN 마디마다 다르게 붙어 같은 판도 바뀐 듯 보이니 뒷받침으로만 쓴다 */
  var GAP=18e4, SLACK=2e3;              /* 삼 분에 한 번, 앞뒤 이 초는 봐준다 */
  var KEY="skip_build_v1:"+location.pathname;
  var MINE=Date.parse(document.lastModified); if(!isFinite(MINE))MINE=0;
  var TAG=null, busy=false, shown=false, last=0;
  function skipped(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function noMore(t){try{localStorage.setItem(KEY,t)}catch(e){}}
  /* 자리가 있으면 지금 판이 언제 것인지 적어 둔다. 눈으로 견줄 데가 있어야 한다 */
  (function(){
    var el=document.getElementById("buildStamp"); if(!el||!MINE)return;
    var d=new Date(MINE), p=function(n){return(n<10?"0":"")+n};
    el.textContent="판 "+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  })();
  function look(force){
    if(busy||shown||!window.fetch)return;
    var now=Date.now(); if(!force&&now-last<GAP)return; last=now; busy=true;
    fetch(location.pathname+"?_="+now,{method:"HEAD",cache:"no-store"})
      .then(function(r){ busy=false; if(!r.ok)return;
        var lm=r.headers.get("last-modified"), et=r.headers.get("etag");
        var t=lm||et; if(!t||t===skipped())return;
        var srv=lm?Date.parse(lm):NaN;
        if(MINE&&isFinite(srv)){ if(srv>MINE+SLACK)band(t); return; }
        /* 날짜를 못 얻는 자리에서만 예전처럼 표를 견준다 */
        if(TAG===null){TAG=t;return}
        if(t!==TAG)band(t);
      }).catch(function(){busy=false});
  }
  function band(t){
    if(shown)return; shown=true;
    var d=document.createElement("div");
    d.setAttribute("role","status");
    d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));"+
      "z-index:99999;background:#1b1f27;color:#f0ead8;border:1px solid #C9A227;border-radius:10px;"+
      "padding:12px 14px;font:600 14px/1.5 -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;"+
      "box-shadow:0 6px 22px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center";
    d.innerHTML='<span style="flex:1">새 판이 나왔습니다. 하던 것을 마치고 눌러 주세요.</span>'+
      '<button type="button" style="flex:none;background:#C9A227;color:#17130F;border:0;border-radius:7px;'+
      'padding:8px 12px;font:700 14px/1 inherit">갈아타기</button>'+
      '<button type="button" aria-label="닫기" style="flex:none;background:none;color:#8b8578;border:0;'+
      'font:700 18px/1 inherit;padding:4px 6px">×</button>';
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){
      var u=location.pathname+location.search;
      location.replace(u+(location.search?"&":"?")+"_v="+Date.now());
    };
    /* 닫기를 눌렀으면 이 판으로는 다시 묻지 않는다. 그다음 판은 또 알린다 */
    b[1].onclick=function(){d.remove();shown=false;noMore(t)};
    document.body.appendChild(d);
  }
  look(true);
  /* 앱을 다시 열 때만 본다. focus 까지 걸면 한 번 오갈 때 두 번 물어본다 */
  document.addEventListener("visibilitychange",function(){if(!document.hidden)look()});
})();
</script>
</body>
</html>
