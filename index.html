<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcf5f3">
<title>삼국지 공방</title>
<!-- 타이틀 화면(2026-11-02, 사용자 「배경이 너무 안 보인다 — 첨부한 UI 처럼 메인화면을 게임 첫 진입화면처럼, 지금 메인은 거기서 버튼 눌러서 들어가는 식으로」).
     공간의 배경 장면(lib/room.css --room-src)을 화면 가득, 장식 틀(lib/material.css --frame) 안에 공방 현판과 큰 메뉴 단추 다섯 — 드래프트(게임) · 오늘의 대국 · 도감 · 프롬프트 · 군막(공방 안내판 hall.html).
     ◀ ▶(← →)로 공간 아홉을 바로 넘긴다 — 고른 공간은 다른 화면에도 그대로(lib/workspace-theme.js).
     예전 게임 주소의 몫(?daily · ?local · #sam-transfer)은 여기서 draft.html 로 그대로 넘긴다 — 공방 지도 · 옛 북마크 · 옛 /atelier/sam.html 길이 안 끊긴다. -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search), h = location.hash || '';
    if (q.has('daily') || q.has('local') || /sam-transfer=/.test(h)) location.replace('draft.html' + location.search + h);
  } catch (e) { /* 아주 옛 브라우저 — 타이틀 그대로 */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&display=swap">
<link rel="manifest" href="sam.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-sam-180.png">
<link rel="stylesheet" href="lib/workspace.css?v=3">
<script src="lib/workspace-theme.js?v=3"></script>
<script src="lib/words.js?v=3"></script>
<script src="lib/fresh.js?v=1"></script>
<link rel="stylesheet" href="lib/room.css?v=3">
<link rel="stylesheet" href="lib/sam.css?v=3">
<link rel="stylesheet" href="lib/material.css?v=2">
<style>
/* 타이틀 — 배경 장면이 주인공. 막은 메뉴 쪽만 옅게 */
body.title-page {margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);overflow-x:hidden}
.title-bg {position:fixed;inset:0;background-color:var(--bg);background-image:var(--room-src),var(--tex);background-size:cover,384px;background-position:center;background-repeat:no-repeat,repeat}
.title-bg::after {content:'';position:absolute;inset:0;background:
  linear-gradient(90deg,rgb(var(--room-rgb) / .78) 0,rgb(var(--room-rgb) / .38) 34%,rgb(var(--room-rgb) / 0) 58%),
  linear-gradient(0deg,rgb(var(--room-rgb) / .55) 0,rgb(var(--room-rgb) / 0) 28%)}
.title-wrap {position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(320px,440px) 1fr;align-items:center;padding:clamp(16px,4vw,56px)}
.title-menu {padding:30px 30px 24px;background:color-mix(in srgb,var(--card) 78%,transparent);border:1px solid var(--line);border-image:var(--frame) var(--frame-slice) / 34px / 6px var(--frame-rep);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 20px 50px #0007;display:flex;flex-direction:column;gap:12px}
.title-kicker {margin:0;color:var(--signal);font-size:12px;letter-spacing:.14em;text-align:center}
.title-plaque {margin:0 auto 6px;padding:14px 30px;text-align:center;clip-path:var(--b-clip);border-radius:var(--b-rad);background:var(--b-pface);box-shadow:var(--b-pring);color:var(--on-accent)}
.title-plaque h1 {margin:0;font:700 clamp(28px,4vw,38px)/1.1 'Gowun Batang',var(--gallery-serif,serif);letter-spacing:.06em}
.title-plaque p {margin:6px 0 0;font-size:12.5px;opacity:.9}
.menu-btn {display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;padding:10px 26px;color:var(--text);text-decoration:none;font:700 18px/1.2 'Gowun Batang',var(--gallery-serif,serif);letter-spacing:.06em}
.menu-btn small {font:500 11.5px/1.3 'IBM Plex Sans KR',system-ui,sans-serif;letter-spacing:0;color:var(--muted)}
.menu-btn.main small {color:var(--on-accent);opacity:.85}
.title-space {display:flex;align-items:center;gap:8px;margin-top:6px}
.title-space .arrow {min-width:44px;min-height:44px;padding:0;font-size:18px;color:var(--text);cursor:pointer}
.title-space .name {flex:1;text-align:center}
.title-space .name b {display:block;font:700 15px/1.3 'Gowun Batang',var(--gallery-serif,serif);color:var(--text)}
.title-space .name small {display:block;color:var(--muted);font-size:11px;line-height:1.4}
.title-note {grid-column:2;align-self:end;justify-self:end;max-width:420px;margin:0;padding:10px 14px;color:var(--text);font-size:12.5px;line-height:1.6;background:color-mix(in srgb,var(--card) 60%,transparent);border-radius:10px;backdrop-filter:blur(2px)}
@media (max-width:760px) {
  .title-wrap {grid-template-columns:1fr;align-items:end;padding:16px 16px max(16px,env(safe-area-inset-bottom))}
  .title-bg::after {background:linear-gradient(0deg,rgb(var(--room-rgb) / .85) 0,rgb(var(--room-rgb) / .35) 55%,rgb(var(--room-rgb) / 0) 80%)}
  .title-menu {padding:22px 20px 18px;gap:9px}
  .menu-btn {min-height:50px;font-size:16px}
  .title-note {display:none}
}
html[data-background="off"] .title-bg {background-image:none}
</style>
</head>
<body class="title-page">
<div class="title-bg" aria-hidden="true"></div>
<main class="title-wrap">
  <nav class="title-menu" id="menu">
    <p class="title-kicker" id="kicker"></p>
    <div class="title-plaque"><h1 id="t-name"></h1><p id="t-sub"></p></div>
    <a class="menu-btn main" href="draft.html" id="m-draft"></a>
    <a class="menu-btn" href="draft.html?daily" id="m-daily"></a>
    <a class="menu-btn" href="dex.html" id="m-dex"></a>
    <a class="menu-btn" href="prompt.html" id="m-prompt"></a>
    <a class="menu-btn" href="hall.html" id="m-hall"></a>
    <div class="title-space" role="group" id="space">
      <button type="button" class="arrow btn" id="prev">◀</button>
      <div class="name" aria-live="polite"><b id="s-name"></b><small id="s-hint"></small></div>
      <button type="button" class="arrow btn" id="next">▶</button>
    </div>
  </nav>
  <p class="title-note" id="note"></p>
</main>
<script>
/* 말은 낱말 표에서. 공간은 workspace-theme.js 가 쥐고, 여기선 앞 · 뒤로 넘기기만 */
(function () {
  var W = window.W, A = window.AtelierAppearance, $ = function (id) { return document.getElementById(id); };
  $('kicker').textContent = W('title.kicker'); $('t-name').textContent = W('app.title'); $('t-sub').textContent = W('title.sub');
  $('menu').setAttribute('aria-label', W('title.menu')); $('space').setAttribute('aria-label', W('title.space'));
  ['draft', 'daily', 'dex', 'prompt', 'hall'].forEach(function (k) {
    var a = $('m-' + k), b = document.createElement('span'), s = document.createElement('small');
    b.textContent = W('title.' + k); s.textContent = W('title.' + k + '.sub'); a.appendChild(b); a.appendChild(s);
  });
  $('prev').setAttribute('aria-label', W('title.prev')); $('next').setAttribute('aria-label', W('title.next'));
  $('s-hint').textContent = W('title.hint');
  function show() { var t = A.get().theme; $('s-name').textContent = W('title.space') + ' · ' + W('theme.' + t); $('note').textContent = W('theme.note.' + t); }
  function step(d) { var ks = A.themes, i = ks.indexOf(A.get().theme); A.set('theme', ks[(i + d + ks.length) % ks.length]); show(); }
  $('prev').addEventListener('click', function () { step(-1); }); $('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) { if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
  window.addEventListener('atelier-appearance', show);
  show();
  window.AtelierFresh.watch();
})();
</script>
</body>
</html>
