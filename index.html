<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcf5f3">
<title>삼국지 공방</title>
<!-- 타이틀 화면(2026-11-02, 사용자 「배경이 너무 안 보인다 — 첨부한 UI 처럼 메인화면을 게임 첫 진입화면처럼, 지금 메인은 거기서 버튼 눌러서 들어가는 식으로」).
     공간의 배경 장면(lib/room.css --room-src)을 화면 가득, 장식 틀(lib/material.css --frame) 안에 공방 현판과 큰 메뉴 단추 넷 — 머리 메뉴와 같은 차례로 군막(공방 안내판 hall.html) · 드래프트(게임 · 오늘의 대국은 게임 안 새 대국 설정에서) · 도감 · 프롬프트.
     ◀ ▶(← →)로 공간 아홉을 바로 넘긴다 — 고른 공간은 다른 화면에도 그대로(lib/workspace-theme.js).
     예전 게임 주소의 몫(?daily · ?local · #sam-transfer)은 여기서 draft.html 로 그대로 넘긴다 — 공방 지도 · 옛 북마크 · 옛 /atelier/sam.html 길이 안 끊긴다. -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search), h = location.hash || '';
    if (q.has('daily') || q.has('local') || /sam-transfer=/.test(h)) location.replace('draft.html' + location.search + h);
  } catch (e) { /* 아주 옛 브라우저 — 타이틀 그대로 */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap" media="print" onload="this.media='all'">   <!-- 본문 글꼴 — 화면 그리기를 막지 않게(오면 바뀐다). 제목 글꼴은 lib/workspace-theme.js 가 공간 것 하나만 -->
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap"></noscript>
<link rel="manifest" href="sam.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-sam-180.png">
<link rel="stylesheet" href="lib/workspace.css?v=5">
<script src="lib/workspace-theme.js?v=4"></script>
<script src="lib/words.js?v=7"></script>
<script src="lib/fresh.js?v=1"></script>
<link rel="stylesheet" href="lib/room.css?v=3">
<link rel="stylesheet" href="lib/sam.css?v=7">
<link rel="stylesheet" href="lib/material.css?v=6">
<style>
/* 타이틀 — 배경 장면이 주인공. 막은 메뉴 쪽만 옅게 */
body.title-page {margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);overflow-x:hidden}
.title-bg {position:fixed;inset:0;background-color:var(--bg);background-image:var(--room-src),var(--tex);background-size:cover,384px;background-position:center;background-repeat:no-repeat,repeat}
.title-bg::after {content:'';position:absolute;inset:0;background:   /* 밝은 공간도 메뉴 쪽은 어둡게 — 금빛 글씨 · 그림 단추가 서도록 */
  linear-gradient(90deg,#000a 0,#0006 30%,#0000 55%),
  linear-gradient(0deg,#0008 0,#0000 30%)}
.title-wrap {position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(320px,460px) 1fr;align-items:center;padding:clamp(16px,4vw,56px)}
/* 현판 · 단추 · 둥근 단추는 공간마다 생성한 그림(그림 저장소 backgrounds/ui/ui-<공간>-<title|main|btn|round>.webp, 투명, 변수 --ui-* 는 lib/material.css) — 글씨만 낱말 표에서 얹는다.
   그림 한 장 시트를 넷으로 잘랐으니 같은 재질 · 같은 빛 — 사용자 「버튼이나 타이틀이 너무 따로 논다 — 이미지로」(2026-11-02) */
.title-menu {display:flex;flex-direction:column;align-items:stretch;gap:6px}
.title-kicker {margin:0;color:var(--ui-ink);font-size:12px;letter-spacing:.16em;text-align:center;text-shadow:0 1px 3px #000c}
.title-plaque {display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:3.4;margin:0 -4% 4px;padding:0 18%;text-align:center;background:var(--ui-title) center/contain no-repeat;filter:drop-shadow(0 10px 18px #0009)}
.title-plaque h1 {margin:0;font:700 clamp(26px,3.4vw,34px)/1.1 var(--gallery-serif,serif);letter-spacing:.08em;color:var(--ui-ink);text-shadow:0 2px 0 #0008,0 0 18px var(--ui-glow)}
.title-plaque p {margin:6px 0 0;font-size:12.5px;color:#fff;opacity:.88;text-shadow:0 1px 2px #000}
.menu-btn {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;aspect-ratio:5.7;padding:0 20%;background:var(--ui-btn) center/contain no-repeat;color:#fff8ec;text-decoration:none;text-shadow:0 1px 2px #000,0 0 8px #000a;
  font:700 18px/1.15 var(--gallery-serif,serif);letter-spacing:.06em;transition:transform .15s,filter .15s;filter:drop-shadow(0 6px 10px #0008)}
.menu-btn small {font:500 11px/1.2 'IBM Plex Sans KR',system-ui,sans-serif;letter-spacing:0;opacity:.85}
.menu-btn.main {background-image:var(--ui-main);color:var(--ui-main-ink);text-shadow:0 1px 0 var(--ui-main-shadow)}
.menu-btn.main small {opacity:1;font-weight:600}
.menu-btn:hover {transform:translateY(-2px);filter:drop-shadow(0 6px 10px #0008) drop-shadow(0 0 10px var(--ui-glow)) brightness(1.08)}
.menu-btn:focus-visible {outline:2px solid var(--ui-glow);outline-offset:-6px;border-radius:12px}
.title-space {display:flex;align-items:center;gap:8px;margin-top:8px}
.title-space .arrow {flex:none;width:52px;height:52px;padding:0;border:0;background:var(--ui-round) center/contain no-repeat;color:var(--ui-ink);font-size:16px;cursor:pointer;text-shadow:0 0 6px var(--ui-glow),0 1px 2px #000;filter:drop-shadow(0 4px 8px #0008);transition:transform .15s}
.title-space .arrow:hover {transform:scale(1.08)}
.title-space .arrow:focus-visible {outline:2px solid var(--ui-glow);outline-offset:2px;border-radius:50%}
.title-space .name {flex:1;text-align:center;text-shadow:0 1px 3px #000,0 0 10px #000a}
.title-space .name b {display:block;font:700 15px/1.3 var(--gallery-serif,serif);color:var(--ui-ink)}
.title-space .name small {display:block;color:#fff;opacity:.85;font-size:12px;line-height:1.4}
.title-note {grid-column:2;align-self:end;justify-self:end;max-width:420px;margin:0;padding:10px 14px;color:#fff;font-size:12.5px;line-height:1.6;text-shadow:0 1px 3px #000;background:linear-gradient(90deg,#0000,#0008 18%);border-right:2px solid var(--ui-glow)}
@media (max-width:760px) {
  .title-wrap {grid-template-columns:1fr;align-items:end;padding:16px 16px max(16px,env(safe-area-inset-bottom))}
  .title-bg::after {background:linear-gradient(0deg,#000c 0,#0007 55%,#0000 85%)}
  .title-menu {gap:4px}
  .title-plaque h1 {font-size:clamp(19px,6vw,24px);letter-spacing:.06em}
  .title-plaque p {margin-top:3px;font-size:12px}
  .menu-btn {font-size:16px}
  .menu-btn small {display:none}
  .title-note {display:none}
}
/* 배경만 보기 — 빈 곳을 한 번 누르면 메뉴 · 소개가 사라지고 장면만, 다시 누르면 돌아온다(사용자 2026-11-02). 숨긴 동안에도 ← → 로 공간을 넘겨 장면을 구경한다 */
.title-bg::after {transition:opacity .35s}
.title-menu,.title-note {transition:opacity .35s,visibility .35s}
.title-page.bg-only .title-menu,.title-page.bg-only .title-note {opacity:0;visibility:hidden}
.title-page.bg-only .title-bg::after {opacity:0}
.title-peek {position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;margin:0;padding:6px 14px;border-radius:999px;background:#0008;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .35s}
.title-page.bg-only .title-peek {opacity:.85}
.title-wrap {cursor:pointer}
.title-menu,.title-note {cursor:auto}
html[data-background="off"] .title-bg {background-image:none}
</style>
</head>
<body class="title-page">
<div class="title-bg" aria-hidden="true"></div>
<main class="title-wrap">
  <nav class="title-menu" id="menu">
    <p class="title-kicker" id="kicker"></p>
    <div class="title-plaque"><h1 id="t-name"></h1><p id="t-sub"></p></div>
    <a class="menu-btn" href="hall.html" id="m-hall"></a>
    <a class="menu-btn main" href="draft.html" id="m-draft"></a>
    <a class="menu-btn" href="battle.html" id="m-battle"></a>
    <a class="menu-btn" href="dex.html" id="m-dex"></a>
    <a class="menu-btn" href="prompt.html" id="m-prompt"></a>
    <div class="title-space" role="group" id="space">
      <button type="button" class="arrow" id="prev">◀</button>
      <div class="name" aria-live="polite"><b id="s-name"></b><small id="s-hint"></small></div>
      <button type="button" class="arrow" id="next">▶</button>
    </div>
  </nav>
  <p class="title-note" id="note"></p>
</main>
<p class="title-peek" id="peek" aria-live="polite"></p>
<script>
/* 말은 낱말 표에서. 공간은 workspace-theme.js 가 쥐고, 여기선 앞 · 뒤로 넘기기만 */
(function () {
  var W = window.W, A = window.AtelierAppearance, $ = function (id) { return document.getElementById(id); };
  $('kicker').textContent = W('title.kicker'); $('t-name').textContent = W('app.title'); $('t-sub').textContent = W('title.sub');
  $('menu').setAttribute('aria-label', W('title.menu')); $('space').setAttribute('aria-label', W('title.space'));
  ['hall', 'draft', 'battle', 'dex', 'prompt'].forEach(function (k) {
    var a = $('m-' + k), b = document.createElement('span'), s = document.createElement('small');
    b.textContent = W('title.' + k); s.textContent = W('title.' + k + '.sub'); a.appendChild(b); a.appendChild(s);
  });
  $('prev').setAttribute('aria-label', W('title.prev')); $('next').setAttribute('aria-label', W('title.next'));
  $('s-hint').textContent = W('title.hint');
  function show() { var t = A.get().theme; $('s-name').textContent = W('title.space') + ' · ' + W('theme.' + t); $('note').textContent = W('theme.note.' + t); }
  function step(d) { var ks = A.themes, i = ks.indexOf(A.get().theme); A.set('theme', ks[(i + d + ks.length) % ks.length]); show(); }
  $('prev').addEventListener('click', function () { step(-1); }); $('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) { if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
  /* 빈 곳을 누르면 배경만 — 메뉴 · 소개 안을 누르면 그대로. 숨긴 동안엔 어디를 눌러도, Esc 로도 돌아온다 */
  var body = document.body;
  function peek(on) { body.classList.toggle('bg-only', on); $('peek').textContent = on ? W('title.peek') : ''; }
  $('peek').textContent = '';
  document.querySelector('.title-wrap').addEventListener('click', function (e) {
    if (body.classList.contains('bg-only')) return peek(false);
    if (e.target.closest('.title-menu,.title-note')) return;
    peek(true);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && body.classList.contains('bg-only')) peek(false); });
  window.addEventListener('atelier-appearance', show);
  show();
  window.AtelierFresh.watch();
})();
</script>
</body>
</html>
