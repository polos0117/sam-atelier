const W=window.W,IMG=window.AtelierImg,FAV=window.AtelierFavorites,T=window.Tianxia,FAV_HUB='/favorites.html',A='samguk',STORE='samguk_dex_v1';

function groupsOf(d){
  const qun=d.factions.find(f=>f.key==='qun')||{camps:[]},of=k=>d.factions.find(f=>f.key===k);
  return MAIN.filter(of).map(k=>({key:k,ko:of(k).ko,sym:of(k).hanja,fac:k,about:of(k),gs:d.generals.filter(g=>g.faction===k)}))
    .concat((qun.camps||[]).map(c=>({key:c.key,ko:c.ko,fac:'qun',about:c,gs:d.generals.filter(g=>g.camp===c.key)})))
    .concat(qun.key?[{key:'qun',ko:W('dx.qun.all'),sym:qun.hanja,fac:'qun',about:qun,gs:d.generals.filter(g=>g.faction==='qun')}]:[]);
}
/* 열 세력 줄 — 주소의 faction, 그 줄에 ?card= 의 장수가 없으면(안 맞는 주소 · faction 이 없는 주소) 그 장수가 든 줄(군웅은 무리) */
const groupFor=(groups,fac,g)=>{const cur=groups.find(x=>x.key===fac);return g&&!(cur&&cur.gs.includes(g))?groups.find(x=>x.gs.includes(g))||cur||groups[0]:cur||groups[0];};
/* 「‹ 지도」 — 이 공방의 지도 · 막사에서 넘어온 것이면 뒤로 가기(막사로 돌아간다), 아니면 지도로 */
const fromMap=()=>{try{const r=new URL(document.referrer);return history.length>1&&r.origin===location.origin&&[new URL('index.html',location.href).pathname,new URL('./',location.href).pathname].includes(r.pathname);}catch{return false;}};
/* 고른 화풍(2026-11-05 사용자 「도감에 옛날 버전은 따로보게 셀렉트박스로 화풍 선택」) — 기본 화풍이 처음, 앞 화풍(kr_mmorpg …)은 고르개로. 고른 화풍의 그림만 보인다 */

function artStyles(doc){
  const has={};for(const k in doc.img){const m=IMG.styleMap(doc.img[k]);for(const st in m)if(Object.values(IMG.formMap(m[st])).some(f=>f.f)||IMG.casualsOf(m[st],doc.d.vocab.worlds,'f').length)has[st]=(has[st]||0)+1;}
  const order=[doc.s.default,...Object.keys(doc.s.styles||{}).filter(k=>k!==doc.s.default),...Object.keys(has).filter(k=>!(doc.s.styles||{})[k]&&k!==doc.s.default)];
  return order.filter((k,i)=>(k===doc.s.default||has[k])&&order.indexOf(k)===i).map(k=>({key:k,n:has[k]||0}));

function picsOf(doc,g,style){

function Row({doc,g,view,wf,open,setOpen,onOpen,favs}){

/* 크게 보기 — 그 장수의 그림을 차례로. ← → · 밀기 · Esc, 하트 */
function Lightbox({doc,box,setBox,close,favs}){
