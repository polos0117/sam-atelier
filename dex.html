  const remember=(v,w,qq,o)=>{savePref({view:v,w,only:o});try{const u=new URL(location.href);u.searchParams.set('view',v);if(w)u.searchParams.set('w',w);else u.searchParams.delete('w');
    if(qq)u.searchParams.set('q',qq);else u.searchParams.delete('q');if(o)u.searchParams.set('only','1');else u.searchParams.delete('only');u.searchParams.delete('card');u.searchParams.delete('pic');history.replaceState(history.state,'',u);}catch{}};
  /* 크게 보기와 뒤로 가기 — 열 때 기록에 한 칸(samgukLb)을 더해 두면 뒤로 가기가 그 칸을 지우며 팝업만 닫는다(원소 공방 사용자 2026-10-31 「뒤로 가기 누르면 이전 화면으로 넘어가네」).
     닫기 · Esc · 바깥으로 닫으면 그 칸을 우리가 지운다 — 다음 뒤로 가기는 그대로 이전 화면 */
  const isLb=()=>!!(history.state&&history.state.samgukLb);
  const openBox=b=>{if(!isLb()){try{history.pushState({samgukLb:1},'',location.href);}catch{}}setBox(b);};
  const closeBox=()=>{if(isLb()){try{history.back();return;}catch{}}setBox(null);};
  useEffect(()=>{const pop=()=>{if(!isLb())setBox(null);};addEventListener('popstate',pop);return()=>removeEventListener('popstate',pop);},[]);
  const setView=v=>{setViewS(v);remember(v,wf,q,only);},setWf=w=>{setWfS(w);remember(view,w,q,only);},setQ=x=>{setQS(x);remember(view,wf,x,only);},setOnly=o=>{setOnlyS(o);remember(view,wf,q,o);};
  const setSf=x=>{setSfS(x);try{const u=new URL(location.href);if(x)u.searchParams.set('st',x);else u.searchParams.delete('st');history.replaceState(history.state,'',u);}catch{}};
  /* 공방 모음 즐겨찾기에서 ?card=&pic= 로 오면 그 장수로 내려가 그 그림을 연다 */
  useEffect(()=>{if(!doc||doc.failed||deep.current)return;deep.current=true;const ck=param('card'),pic=param('pic');if(!ck)return;
    const g=doc.d.generals.find(x=>x.key===ck);if(!g)return;
    setTimeout(()=>{const el=document.getElementById('c-'+ck);if(el)el.scrollIntoView({block:'start'});},50);
    if(pic&&picsOf(doc,g).some(p=>p.file===pic))openBox({g,file:pic});},[doc]);
  if(!doc)return h('p',{class:'ek-note'},W('dex.loading'));
  if(doc.failed)return h('p',{class:'ek-note'},W('dex.fail'));
  const d=doc.d,ck=param('card'),cg=ck&&d.generals.find(x=>x.key===ck),want=param('faction')||(cg&&cg.faction),f=d.factions.find(x=>x.key===want)||d.factions[0];
  return h('div',null,
    h('nav',{class:'dex-pick','aria-label':W('dex.pick')},d.factions.map(x=>{const gs=d.generals.filter(g=>g.faction===x.key),pr=progress(doc,gs);
      return h('a',{key:x.key,href:'dex.html?faction='+x.key,'aria-current':x.key===f.key?'page':undefined,'data-fac':x.key},h('span',{class:'sym'},x.hanja),x.ko,' ',h('i',null,W('dex.pick.n',{n:gs.length,done:pr.done})));})),
    h(Faction,{doc,f,view,setView,wf,setWf,q,setQ,only,setOnly,sf,setSf,open,setOpen,favs,onOpen:(g,file)=>openBox({g,file})}),
    h(Lightbox,{doc,box,setBox,close:closeBox,favs}));
}
function App(){return h('div',null,h(WorkspaceHeader,{page:'dex'}),h(Dex));}
render(h(App),document.getElementById('app'));
window.AtelierFresh.watch();
</script>
